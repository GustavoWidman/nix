# Rolls every push to `main` out to the fleet with coeus, canary first, then
# advances the `deployed` branch that machines which were offline catch up with.
#
# The runner joins the tailnet as `tag:ci` through a Tailscale OAuth client
# (TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET) and relies on this tailnet policy:
#   - `tagOwners` declares `tag:ci` and `tag:fleet`, which every machine of
#     the fleet carries;
#   - `tag:ci` may reach only `tag:fleet:45729` (coeusd) over tcp.
# COEUS_KEY holds the fleet's pre-shared key.
#
# `coeus deploy` exits non-zero when a reachable machine fails, which fails
# the run and leaves `deployed` where it was. Unreachable machines are skipped
# and catch up on their own.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: Machines to deploy, e.g. `@all`, `lab`, `@nixos !oracle-2`
        type: string
        default: "@all"
      action:
        description: What to do with the new configuration
        type: choice
        options: [switch, boot, build]
        default: switch
      ref:
        description: Branch or tag to deploy (default the dispatching branch)
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      TARGETS: ${{ inputs.targets || '@all' }}
      ACTION: ${{ inputs.action || 'switch' }}
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # the job evaluates a file and substitutes one closure, which a plain Nix
      # set up from a prebuilt store does in a second
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://cache.nixos.org/ https://cache.r3dlust.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.r3dlust.com-1:Wdkf9mes2ued0P7C7CL3Jax1b4KPuJwQpM3h4G/Z+yI=

      - uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # from `hosts/` alone: the flake's `coeus.clientConfig` would first fetch
      # nixpkgs for the few lib functions it uses
      - name: Write the fleet inventory
        run: |
          nix eval --raw --file .github/coeus.nix > "$RUNNER_TEMP/coeus.toml"
          echo "COEUS_CONFIG=$RUNNER_TEMP/coeus.toml" >> "$GITHUB_ENV"

      - name: Find the coeus the fleet runs
        id: coeus
        run: |
          locked=$(jq -r '.nodes[.nodes.root.inputs.coeus].locked | "\(.owner)/\(.repo)/\(.rev)"' flake.lock)
          printf 'locked=%s\n' "$locked" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "${locked//\//-}" >> "$GITHUB_OUTPUT"

      # the store path of that coeus and its closure, saved for each locked
      # coeus: naming a coeus build means evaluating coeus' flake, most of a
      # minute, and the closure comes faster from here than from a binary cache
      - name: Recall that coeus
        id: recalled
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/coeus-saved
          key: coeus-cli-x86_64-linux-${{ steps.coeus.outputs.key }}

      - name: Fetch the coeus CLI
        env:
          COEUS: github:${{ steps.coeus.outputs.locked }}#packages.x86_64-linux.default
          SAVED: ${{ runner.temp }}/coeus-saved
        run: |
          if [ -s "$SAVED/path" ]; then
            path=$(cat "$SAVED/path")
            # unsigned when built here; only runs on main save what main restores
            nix copy --no-check-sigs --from "file://$SAVED/store" "$path"
          else
            path=$(nix eval --raw "$COEUS.outPath")
            # a released coeus comes from the binary cache; any other commit builds here
            nix build --no-link "$path" || nix build --no-link "$COEUS"
            nix copy --to "file://$SAVED/store?compression=zstd" "$path"
            printf '%s\n' "$path" > "$SAVED/path"
          fi
          nix build --out-link "$RUNNER_TEMP/coeus" "$path"
          echo "$RUNNER_TEMP/coeus/bin" >> "$GITHUB_PATH"

      # right away, so a deployment that fails still leaves it for the next run
      - name: Remember that coeus
        if: steps.recalled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/coeus-saved
          key: coeus-cli-x86_64-linux-${{ steps.coeus.outputs.key }}

      - name: Deploy
        env:
          COEUS_KEY: ${{ secrets.COEUS_KEY }}
        run: |
          read -ra targets <<< "$TARGETS"
          mode=()
          if [ "$ACTION" != switch ]; then mode=("--$ACTION"); fi

          coeus deploy "${targets[@]}" \
            --rev "$(git rev-parse HEAD)" --ref "$REF" \
            --canary @canary --skip-unreachable "${mode[@]}"

      # only a switch of main to the whole fleet moves what every machine follows
      - name: Advance `deployed`
        if: env.ACTION == 'switch' && env.TARGETS == '@all' && env.REF == 'main'
        run: git push --force origin "$(git rev-parse HEAD):refs/heads/deployed"
