# Rolls every push to `main` out to the fleet with coeus, canary first, then
# advances the `deployed` branch that machines which were offline catch up with,
# and has every machine that answers look it up at once.
#
# The runner joins the tailnet as `tag:ci` through a Tailscale OAuth client
# (TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET) and relies on this tailnet policy:
#   - `tagOwners` declares `tag:ci` and `tag:fleet`, which every machine of
#     the fleet carries;
#   - `tag:ci` may reach only `tag:fleet:45729` (coeusd) over tcp.
# COEUS_KEY holds the fleet's pre-shared key. COEUS_PUSH_IDENTITY is the
# private half of .github/ci.pub, which opens modules/common/coeus/push/ and
# no other secret.
#
# `coeus deploy` exits non-zero when a reachable machine fails, which fails
# the run and leaves `deployed` where it was. Unreachable machines are skipped
# and catch up on their own.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: Machines to deploy, e.g. `@all`, `lab`, `@nixos !oracle-2`
        type: string
        default: "@all"
      action:
        description: What to do with the new configuration
        type: choice
        options: [switch, boot, build]
        default: switch
      ref:
        description: Branch or tag to deploy (default the dispatching branch)
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      TARGETS: ${{ inputs.targets || '@all' }}
      ACTION: ${{ inputs.action || 'switch' }}
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # the job evaluates a file and substitutes one closure, which a plain Nix
      # set up from a prebuilt store does in a second
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://cache.nixos.org/ https://cache.r3dlust.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.r3dlust.com-1:Wdkf9mes2ued0P7C7CL3Jax1b4KPuJwQpM3h4G/Z+yI=

      # the action comes from this workflow's own commit, so a dispatch can
      # still deploy a ref from before .github/actions existed
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions

      # the fleet inventory, the coeus CLI the fleet runs, and the tailnet seat
      - uses: ./.ci/.github/actions/coeus
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      # coeus pushes the deploy's summary to the owner's devices. it opens the
      # checkout's two push secrets in memory with the workflow's own key,
      # which lives only in a 0600 file for this step; without that key it
      # sends nothing, and a push that fails never fails the deploy
      - name: Deploy
        env:
          COEUS_KEY: ${{ secrets.COEUS_KEY }}
          COEUS_PUSH_IDENTITY: ${{ secrets.COEUS_PUSH_IDENTITY }}
        run: |
          if [ -n "$COEUS_PUSH_IDENTITY" ]; then
            identity="$RUNNER_TEMP/push-identity"
            config="$RUNNER_TEMP/coeus-push.toml"
            trap 'rm -f "$identity" "$config"' EXIT
            (umask 077 && printf '%s\n' "$COEUS_PUSH_IDENTITY" > "$identity")
            secrets="$GITHUB_WORKSPACE/modules/common/coeus/push"
            {
              cat "$COEUS_CONFIG"
              printf '\n[settings.push]\n'
              printf 'origin = "https://coeus.r3dlust.com"\n'
              printf 'vapid_key_file = "%s"\n' "$secrets/vapid.age"
              printf 'subscriptions_file = "%s"\n' "$secrets/subscriptions.age"
              printf 'identity_file = "%s"\n' "$identity"
            } > "$config"
            export COEUS_CONFIG="$config"
          fi
          unset COEUS_PUSH_IDENTITY

          read -ra targets <<< "$TARGETS"
          mode=()
          if [ "$ACTION" != switch ]; then mode=("--$ACTION"); fi

          coeus deploy "${targets[@]}" \
            --rev "$(git rev-parse HEAD)" --ref "$REF" \
            --canary @canary --skip-unreachable "${mode[@]}"

      # only a switch of main to the whole fleet moves what every machine follows
      - name: Advance `deployed`
        if: env.ACTION == 'switch' && env.TARGETS == '@all' && env.REF == 'main'
        run: git push --force origin "$(git rev-parse HEAD):refs/heads/deployed"

      # a machine otherwise sees `deployed` move only on its next scheduled
      # look, and shows it held until then. `deployed` already moved, so a
      # machine that cannot look marks this step without failing the run.
      - name: Have the fleet look up `deployed`
        if: env.ACTION == 'switch' && env.TARGETS == '@all' && env.REF == 'main'
        continue-on-error: true
        env:
          COEUS_KEY: ${{ secrets.COEUS_KEY }}
        run: coeus catch-up @all --skip-unreachable
